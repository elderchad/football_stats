services:
  api:
    build: ./api
    image: nfl-record-walk-api:local
    environment:
      GAMES_CACHE_PATH: /data/games.csv
      HISTORICAL_CACHE_PATH: /data/nfl_elo.csv
      QB_STATS_CACHE_DIR: /data/qb_stats
      NCAAF_CACHE_DIR: /data/ncaaf
      NCAAF_HISTORY_CACHE_DIR: /data/ncaaf_history
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - games-cache:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  web:
    build: ./web
    image: nfl-record-walk-web:local
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  games-cache:
